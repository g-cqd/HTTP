name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On-demand full run; with `update_baseline` it also captures a runner-class benchmark
  # baseline (uploaded as an artifact to commit under Benchmarking/Benchmarks/.benchmarkBaselines/),
  # which is what activates the low-noise benchmark regression gate in the `benchmarks` job.
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Capture the benchmark baseline on this runner class and upload it as an artifact"
        type: boolean
        default: false

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCRATCH: /tmp/swiftpm-build/HTTP

jobs:
  # ---------------------------------------------------------------------------
  # Style & safety gates: native swift-format + SwiftLint (force-unwrap/cast/try).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift-format (strict)
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: SwiftLint (strict)
        run: |
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --strict

  # ---------------------------------------------------------------------------
  # Build + full test suite. Warnings-as-errors is enabled via HTTP_WARNINGS_AS_ERRORS, which the
  # manifest scopes to OUR targets only (using .treatAllWarnings) — keeping the package reuse-safe
  # and avoiding the -suppress-warnings conflict that a global -Xswiftc flag hits on dependencies.
  # ---------------------------------------------------------------------------
  build-test:
    runs-on: macos-26
    env:
      HTTP_WARNINGS_AS_ERRORS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Toolchain
        run: swift --version
      - name: Build (warnings as errors)
        run: swift build --scratch-path "$SCRATCH"
      - name: Test (with coverage)
        run: swift test --scratch-path "$SCRATCH" --enable-code-coverage
      # Coverage gate. SwiftPM emits a per-target .xctest bundle, so a single-binary llvm-cov export
      # under-reports the modules that bundle does not link; merging the merged profdata across every
      # bundle gives the true Sources line coverage. Threshold 85% (Sources are ~92% today) — a floor
      # against a module losing its tests, with headroom for normal churn; raise it as coverage grows.
      - name: Coverage gate (Sources lines ≥ 85%)
        run: |
          set -euo pipefail
          prof="$(find "$SCRATCH" -name default.profdata | head -1)"
          bins=()
          while IFS= read -r b; do bins+=("$b/Contents/MacOS/$(basename "$b" .xctest)"); done < <(find "$SCRATCH" -name "*.xctest" -type d)
          objs=("${bins[0]}"); for o in "${bins[@]:1}"; do objs+=(-object "$o"); done
          xcrun llvm-cov export -format=text -instr-profile="$prof" -ignore-filename-regex="Tests/|[.]build/|Benchmarking/|checkouts/" "${objs[@]}" > cov.json
          python3 -c "import json,sys; p=json.load(open('cov.json'))['data'][0]['totals']['lines']['percent']; print('Sources line coverage: %.2f%%' % p); sys.exit(0 if p>=85 else 1)" || { echo '::error::Sources line coverage is below the 85% threshold'; exit 1; }

  # ---------------------------------------------------------------------------
  # Release-mode test lane: optimized build + full suite, catching optimizer-only and release-assert
  # behavior the debug run misses (also the configuration the perf numbers + h2spec use).
  # ---------------------------------------------------------------------------
  release-test:
    runs-on: macos-26
    env:
      HTTP_WARNINGS_AS_ERRORS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Toolchain
        run: swift --version
      - name: Test (release)
        run: swift test -c release --scratch-path "$SCRATCH"

  # ---------------------------------------------------------------------------
  # Hard constraint (CLAUDE.md): SwiftNIO MUST NOT appear in the dependency graph.
  # ---------------------------------------------------------------------------
  no-swiftnio:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Assert no SwiftNIO transitive dependency
        run: |
          deps="$(swift package show-dependencies --format flatlist 2>/dev/null || true)"
          echo "$deps"
          if printf '%s\n' "$deps" | grep -iE 'swift-nio|/nio'; then
            echo "::error::SwiftNIO present in the dependency graph — forbidden by CLAUDE.md"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Dependency reproducibility. `ADFoundation` is first-party and UNVERSIONED, and it used to be
  # taken from `branch: "main"`. A moving branch means two checkouts of the same HTTP commit can
  # resolve different dependency code — so a build is not reproducible, a benchmark number is not
  # attributable to a commit, and a green CI run is not evidence about any particular input. It is
  # pinned to an exact revision in the manifest instead.
  #
  # `Package.resolved` stays GITIGNORED on purpose: this is a reusable library, and committing a
  # lockfile would publish one resolution of the whole graph to every consumer, who must resolve
  # their own. That is precisely why the manifest pin has to be exact — with no committed lockfile,
  # the manifest is the only thing making this package's own builds deterministic.
  #
  # Both halves were already in place; nothing enforced either. This job does: the pin must be a
  # 40-hex revision (no branch, no version range), Package.resolved must stay untracked, and
  # resolving the graph must actually land on the pinned revision with no branch or version
  # attached. Verified red in both directions (branch pin; committed lockfile) before landing.
  # ---------------------------------------------------------------------------
  dependency-pinning:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Assert ADFoundation is pinned to an exact revision
        run: python3 scripts/dependency-pinning.py

  # ---------------------------------------------------------------------------
  # Trap-surface gate. The request path must stay free of process-aborting traps, so one bad request
  # can never crash the whole server (the in-process half of crash defense; prefork covers app traps).
  # SwiftLint already gates try!/as!/force-unwrap; this covers fatalError/precondition/assertionFailure
  # /.unsafelyUnwrapped, which abort in release.
  # ---------------------------------------------------------------------------
  trap-lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Assert the request path is trap-free
        run: |
          targets="Sources/Core/HTTPCore Sources/Protocols/HTTP1 Sources/Protocols/HTTP2 Sources/Protocols/HPACK Sources/Protocols/QPACK Sources/Protocols/HTTP3 Sources/Protocols/WebSocket Sources/Server/HTTPServer Sources/Transport/HTTPTransport Sources/Core/HTTPConcurrency"
          pattern='(fatalError|preconditionFailure|assertionFailure)\(|(^|[^A-Za-z.])precondition\(|(^|[^A-Za-z])assert\(|\.unsafelyUnwrapped'
          hits="$(grep -rnE "$pattern" $targets --include='*.swift' 2>/dev/null | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::process-aborting trap in the request path — one bad request must not crash the server"
            exit 1
          fi
          echo "request path is trap-free"

  # ---------------------------------------------------------------------------
  # RFC-citation gate. CLAUDE.md: "Always reference RFC/ISO/Norms/Standards/CVE". Every wire
  # parser/decoder must cite the standard it implements, so the normative basis for a parse stays in the
  # source rather than tribal knowledge. Presence-only (a citation exists in the file), not a
  # correctness claim — but it makes "which RFC?" un-skippable in review for the files that parse bytes.
  # ---------------------------------------------------------------------------
  rfc-citations:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Assert wire parsers/decoders cite their standard
        run: |
          set -euo pipefail
          missing=""
          while IFS= read -r f; do
            grep -qE 'RFC[[:space:]]*[0-9]|§|CVE-|ISO[[:space:]/]' "$f" || missing+="$f"$'\n'
          done < <(find Sources/Protocols Sources/Core/HTTPCore \( -name '*Parser.swift' -o -name '*Decoder.swift' \) | sort)
          if [ -n "$missing" ]; then
            printf '%s\n' "$missing"
            echo "::error::a wire parser/decoder cites no RFC/§/CVE/ISO standard — reference the norm it implements"
            exit 1
          fi
          echo "every wire parser/decoder cites its standard"

  # ---------------------------------------------------------------------------
  # SE-0458 strict memory safety — the STAGED gate (ADR 0009, superseding ADR 0002).
  #
  # CLAUDE.md asks for "strict memory". The package cannot turn `-strict-memory-safety` on globally:
  # the census below counts 465 expressions that use unsafe constructs without an `unsafe` marker, and
  # under warnings-as-errors every one of them is a build error. So the gate is staged in two halves.
  #
  #   • The HARD half is in the manifest, not here: `strictMemorySafeTargets` in Package.swift adds
  #     `.strictMemorySafety()` to the targets already at zero (HTTPConcurrency, HPACK, QPACK,
  #     HTTPObservability, HTTPAuth). `build-test` and `release-test` run with HTTP_WARNINGS_AS_ERRORS,
  #     so a new un-annotated unsafe expression in one of those targets is a BUILD ERROR there.
  #   • The RATCHET half is this job: a full `-strict-memory-safety` census of the remaining nine
  #     targets, compared against `.github/strict-memory-safety-budget.tsv`. A count may fall freely;
  #     if one rises, this job fails and names the target. A target that reaches 0 graduates into the
  #     manifest list and stops being a number.
  #
  # Its own job (not folded into build-test) because it is a full rebuild under a different flag set,
  # and because a ratchet breach should read as its own red X rather than as a build failure.
  # ---------------------------------------------------------------------------
  strict-memory-safety:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Toolchain
        run: swift --version
      - name: Census + ratchet (per-target unsafe-site budget)
        run: python3 scripts/strict-memory-safety.py --verbose

  # ---------------------------------------------------------------------------
  # Data-race & memory checks. Parsers must stay clean under ASan/TSan.
  # ---------------------------------------------------------------------------
  sanitizers:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Test under ${{ matrix.sanitizer }} sanitizer
        run: swift test --scratch-path "$SCRATCH" --sanitize=${{ matrix.sanitizer }}

  # ---------------------------------------------------------------------------
  # Optional-feature manifest paths the DEFAULT graph never compiles, so a regression in them is
  # otherwise invisible until a downstream first opts in: the portable libssl-over-POSIX TLS backbone
  # (HTTP_PORTABLE_TLS — C++ interop + the vendored BoringSSL build) and the Zstandard content coding
  # (HTTP_ZSTD — the libzstd shim, Homebrew-prefix path). These are the most fragile manifest branches;
  # build them under warnings-as-errors so a manifest or shim break is caught here. (The Linux zstd path
  # is exercised by codings-linux; this is the macOS Homebrew-prefix path plus the TLS backbone, which
  # has no CI lane at all. Running the gated suites — only compiled under these flags — is a follow-up.)
  # ---------------------------------------------------------------------------
  optional-features:
    runs-on: macos-26
    env:
      HTTP_WARNINGS_AS_ERRORS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Toolchain
        run: swift --version
      - name: Build — portable libssl TLS (HTTP_PORTABLE_TLS)
        env:
          HTTP_PORTABLE_TLS: "1"
        run: swift build --scratch-path "$SCRATCH/opt-tls"
      - name: Build — Zstandard coding (HTTP_ZSTD)
        env:
          HTTP_ZSTD: "1"
          HTTP_ZSTD_PREFIX: /opt/homebrew/opt/zstd
        run: |
          brew list zstd >/dev/null 2>&1 || brew install zstd
          swift build --scratch-path "$SCRATCH/opt-zstd"

  # ---------------------------------------------------------------------------
  # The Django comparison's "ours" subject (Benchmarking/Django/ours) is its OWN package, so nothing in
  # the default graph compiles it — and it silently stopped compiling against two breaking library
  # changes (HTTPLimits' properties becoming `let`, TransportFactory.make becoming throwing) with every
  # other gate green. It is the only out-of-graph package that consumes this library's API and is not
  # already gated (Benchmarking/Benchmarks has the `benchmarks` job; Bench/vapor and Bench/hummingbird
  # depend on third-party frameworks only and cannot rot against us).
  #
  # Build-only, and deliberately so: running the comparison needs `oha`, a Python venv and a quiet box,
  # none of which a shared runner has. What this gates is the thing that actually broke — that the
  # harness still compiles against the library it measures. Release, because that is the only
  # configuration the harness ever builds (debug benchmark numbers are fiction) and it is where the
  # optimizer-visible API breaks surface.
  #
  # BENCH_ADJSON is deliberately NOT set: the ADJSON backend is an unpublished local sibling checkout,
  # so the default graph is this repository alone. That is what makes this job possible at all.
  # ---------------------------------------------------------------------------
  django-bench:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Toolchain
        run: swift --version
      - name: Build — Django comparison subject (release)
        run: |
          swift build -c release --package-path Benchmarking/Django/ours \
            --product ours-bench --scratch-path "$SCRATCH/django-bench"

  # ---------------------------------------------------------------------------
  # Linux (G0). The sans-I/O engines + server runtime run on Linux over the epoll backbone; these jobs
  # build and run the full suite in the official Swift container on ubuntu-latest (locally reproduced by
  # scripts/linux-test.sh via apple/container). HTTP_WARNINGS_AS_ERRORS is intentionally off here:
  # swift-crypto's NIST-curve keys are not Sendable on Linux (CryptoKit's are), so HTTPAuth emits
  # @preconcurrency warnings the Apple build does not — re-enable once those are addressed. HTTP/3/QUIC is
  # Network.framework-provided, so it (and its tests) is excluded from the Linux build graph.
  # ---------------------------------------------------------------------------
  build-test-linux:
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-noble
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --scratch-path "$SCRATCH"
      - name: Test (full suite)
        run: swift test --scratch-path "$SCRATCH"

  release-test-linux:
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-noble
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test (release)
        run: swift test -c release --scratch-path "$SCRATCH"

  sanitizers-linux:
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-noble
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Test under ${{ matrix.sanitizer }} sanitizer (Linux)
        run: swift test --scratch-path "$SCRATCH" --sanitize=${{ matrix.sanitizer }}

  # ---------------------------------------------------------------------------
  # Opt-in content codings on Linux (G0): Brotli (libbrotli) + zstd (libzstd), the system-lib codings the
  # default graph never links. apt-install the dev packages, then run the coding round-trip suites under
  # HTTP_BROTLI/HTTP_ZSTD (prefix /usr). gzip needs no flag — system zlib, covered by build-test-linux.
  # ---------------------------------------------------------------------------
  codings-linux:
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-noble
    env:
      HTTP_BROTLI: "1"
      HTTP_BROTLI_PREFIX: /usr
      HTTP_ZSTD: "1"
      HTTP_ZSTD_PREFIX: /usr
    steps:
      - uses: actions/checkout@v4
      - name: Install libbrotli + libzstd
        run: apt-get update -qq && apt-get install -y -qq libbrotli-dev libzstd-dev
      - name: Coding round-trips (Brotli + zstd + Linux gzip/inflate)
        run: swift test --scratch-path "$SCRATCH" --filter "CBrotli|Zstd|GzipLinux|InflateLinux"

  # ---------------------------------------------------------------------------
  # Benchmarks (ordo-one/package-benchmark, isolated in Benchmarking/Benchmarks/). REQUIRED for
  # harness health — the P10 "flip low-noise gates" item: the suite must build and every benchmark
  # must run, which is deterministic (the advisory era silently masked BOTH a missing 6.4-toolchain
  # install and a TransportBackbone switch bitrot). Perf-DRIFT gating uses the LOW-NOISE pair the
  # suite pins in code (Benchmarks.swift: .mallocCountTotal absolute zero-delta, .instructions
  # ±5%; wall/CPU/throughput deliberately carry no thresholds — runner noise): `baseline check`
  # activates automatically once a runner-class baseline is committed under
  # Benchmarking/Benchmarks/.benchmarkBaselines/. Capture one via workflow_dispatch with
  # update_baseline=true, download the artifact, and commit it.
  #
  # WHY NO BASELINE IS COMMITTED YET (PERF-2, 2026-08-01). The gate has never activated, and the
  # tempting fix — capture one on a developer machine and commit it — was measured and rejected.
  # The `.instructions` threshold gates p90 and p99 at ±5 %. Instruction COUNTS are deterministic,
  # but the p90/p99 of a sampled distribution are not: preemption inflates the counter on a busy
  # box. Measured on the PERF-2 host at load ~30 on 10 cores, p99 instructions ran 0–75 % above p0
  # across the routing suite (median ~11 %, four benchmarks above 18 %) — i.e. the noise floor
  # exceeded the gate's own threshold by up to 15x.
  #
  # A baseline captured under that noise is PADDED by it. It would not cry wolf; it would do the
  # quieter and worse thing and never fire, because every real regression smaller than the padding
  # would fit underneath it. `.mallocCountTotal` at absolute zero-delta would survive the transfer
  # (mallocs are flat regardless of load), but that is the one metric already locked deterministically
  # by `expectAllocations` in the `swift test` gate, so it would add nothing.
  #
  # A meaningful baseline therefore has to come from this runner class, which is what the dispatch
  # path below exists for — and it must PROVE it is quiet enough to be worth committing. The capture
  # path now re-runs the suite against the baseline it just took: a runner that cannot reproduce its
  # own numbers back to back cannot gate anyone else's, and its artifact must be discarded rather
  # than committed.
  # ---------------------------------------------------------------------------
  benchmarks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Install jemalloc (package-benchmark malloc metrics)
        run: brew list jemalloc >/dev/null 2>&1 || brew install jemalloc
      - name: Toolchain
        run: swift --version
      - name: Benchmark run (low-noise gate once a baseline is committed)
        run: |
          if ls -d Benchmarking/Benchmarks/.benchmarkBaselines/*/main >/dev/null 2>&1; then
            # Committed baseline present: run the suite AND gate on the deterministic thresholds.
            swift package --package-path Benchmarking/Benchmarks --disable-sandbox \
              benchmark baseline check main
          else
            # No baseline yet: the harness-health half of the gate (build + every benchmark runs).
            swift package --package-path Benchmarking/Benchmarks --disable-sandbox benchmark
            echo "::notice::no committed benchmark baseline — drift gate inactive by decision, not by omission. A baseline must be captured on THIS runner class (dispatch with update_baseline=true) and must pass the self-reproduction check; see the comment above this job."
          fi
      - name: Capture baseline (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        run: |
          swift package --package-path Benchmarking/Benchmarks --disable-sandbox \
            --allow-writing-to-package-directory benchmark baseline update main
      # Qualify the baseline before anyone commits it. A second run of the same code on the same
      # runner must pass the same thresholds the baseline will later enforce; if it does not, the
      # runner's noise is larger than the gate's tolerance and the artifact is not fit to gate a PR.
      # This step is allowed to fail — it reports fitness, it does not block the capture — but a
      # FAILING result means: do not commit the artifact.
      - name: Qualify baseline (self-reproduction on the capturing runner)
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        continue-on-error: true
        run: |
          if swift package --package-path Benchmarking/Benchmarks --disable-sandbox \
              benchmark baseline check main; then
            echo "::notice::baseline qualified — this runner reproduced its own numbers within the pinned thresholds; the artifact is fit to commit"
          else
            echo "::warning::baseline NOT qualified — this runner could not reproduce its own numbers within the pinned thresholds. Its noise floor exceeds the gate's tolerance, so committing this artifact would produce a gate that either fires spuriously or is padded blind. Discard it and re-capture on a quieter runner."
          fi
      - name: Upload baseline artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline-main
          path: Benchmarking/Benchmarks/.benchmarkBaselines/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # HTTP/2 conformance — h2spec (RFC 9113) against the live httpd-example over h2c. Gates on the
  # sections that pass 100% (frame format, streams & multiplexing, frame definitions, GOAWAY, message
  # exchanges, HPACK). Only the invalid-preface case (generic/http2-3, a benign h2c/HTTP-1 ambiguity) is
  # excluded — see docs/standards/CONFORMANCE.md. The hard `timeout` turns any future hang into a failure.
  # ---------------------------------------------------------------------------
  h2spec:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Install h2spec (+ coreutils for GNU timeout)
        # macos-26 ships no `timeout` binary (the step died with exit 127 "timeout: command not
        # found"); coreutils provides it as `gtimeout`, keeping the hard anti-hang bound intact.
        run: |
          brew list h2spec >/dev/null 2>&1 || brew install h2spec
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
      - name: Build example server (release)
        run: swift build -c release --product httpd-example --scratch-path "$SCRATCH"
      - name: h2spec — core sections (h2c)
        run: |
          BIN="$(swift build -c release --product httpd-example --scratch-path "$SCRATCH" --show-bin-path)/httpd-example"
          HTTPD_MAX_CONN=100000 "$BIN" 18080 posixKqueue >/tmp/httpd.log 2>&1 &
          PID=$!
          # Wait for the listener via an h2c prior-knowledge probe (up to 20s).
          for _ in $(seq 1 40); do
            if curl -s --http2-prior-knowledge --max-time 1 -o /dev/null http://127.0.0.1:18080/; then
              break
            fi
            sleep 0.5
          done
          set +e
          gtimeout 120 h2spec -h 127.0.0.1 -p 18080 --timeout 3 http2/4 http2/5 http2/6 http2/7 http2/8 hpack
          rc=$?
          set -e
          kill "$PID" 2>/dev/null || true
          exit $rc

  # ---------------------------------------------------------------------------
  # WebSocket conformance — the Autobahn TestSuite (RFC 6455) fuzzingclient against httpd-example's /ws
  # echo. ubuntu-latest has Docker (the macOS image does not — why this was deferred): the server runs in
  # the Swift container on the host network, Autobahn runs as its own container against it. REQUIRED
  # (P10 promotion, 2026-07-02): observed green across consecutive CI runs, so the report gate now
  # blocks. CI-only — not locally reproducible here (no Docker on the dev machine). Config + report
  # gate: .github/conformance/autobahn/.
  # ---------------------------------------------------------------------------
  autobahn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start httpd-example (/ws echo) in the Swift container, host network
        run: |
          docker run -d --name httpd --network host -v "$PWD:/work" -w /work \
            swiftlang/swift:nightly-noble \
            bash -lc 'swift build -c release --product httpd-example --scratch-path /tmp/bld \
              && exec /tmp/bld/release/httpd-example 9001 posixEpoll'
          # Wait (covering the in-container release build) for the WebSocket listener.
          for _ in $(seq 1 90); do
            curl -s -o /dev/null --max-time 1 http://127.0.0.1:9001/ && break
            sleep 2
          done
      - name: Run the Autobahn fuzzingclient
        run: |
          mkdir -p reports
          docker run --rm --network host \
            -v "$PWD/.github/conformance/autobahn:/config:ro" \
            -v "$PWD/reports:/reports" \
            crossbario/autobahn-testsuite \
            wstest -m fuzzingclient -s /config/fuzzingclient.json
      - name: Gate the report (no FAILED cases)
        run: python3 .github/conformance/autobahn/check.py reports/index.json
      - name: Stop the server
        if: always()
        run: docker rm -f httpd || true

  # ---------------------------------------------------------------------------
  # HTTP/3 conformance (RFC 9114 / RFC 9204) — THE GATE. Required; no continue-on-error.
  #
  # This replaces the advisory external-`h3spec` job as the thing that fails on an HTTP/3 regression.
  # The reasoning is measured, not assumed (2026-07-31, arm64 macOS, h3spec v0.1.13, release build):
  #
  #   • h3spec CAN split its suite — it takes hspec's `-m/--match` and `-s/--skip`, and its 49 cases
  #     are grouped `describe "QUIC servers"` (34: 27 RFC 9000 transport + 7 RFC 9001 TLS) and
  #     `describe "HTTP/3 servers"` (15: 11 RFC 9114 + 4 RFC 9204). So `-m "HTTP/3 servers"` selects
  #     exactly the subset that exercises our code. The split is mechanically available.
  #   • It still cannot gate. Re-running the full suite reproduces 49 examples / 48 failures, and
  #     ALL 48 carry the identical message `did not get expected exception: QUICException`; with
  #     `-d` the cause is `ConnectionIsTimeout "Client Handshaking"`. The HTTP/3-layer cases fail for
  #     exactly the reason the transport ones do — the client never completes a QUIC handshake, so
  #     nothing ever reaches the h3 layer. An intentionally broken H3 engine would produce a
  #     byte-identical report. Zero discriminating power.
  #   • The previously documented cause ("Apple's closed QUIC rejects h3spec's Haskell client") does
  #     not survive measurement. `ModernQUICTransport.start` builds its `Network.NetworkListener`
  #     without a port, so the QUIC listener binds an EPHEMERAL UDP port and only announces it via
  #     Alt-Svc (observed `alt-svc: h3=":50649"` while this job dialed 14433). h3spec has no Alt-Svc
  #     discovery. The job has been dialing a UDP port with nothing on it. See
  #     docs/standards/CONFORMANCE.md; the listener fix is transport work, tracked there.
  #
  # So the gate is built from the in-repo suites, which drive the same 15 RFC 9114/9204 MUSTs against
  # the real engine: `H3SpecTests` mirrors h3spec's catalog row-for-row (its `catalogIsWellFormed`
  # pins the 27/7/11/4 layer split, so the mirror cannot silently narrow) and
  # `endpointClosesWithMandatedError` drives each `.supported` row and asserts the mandated error
  # code. Release configuration, because that is where an optimizer-visible engine regression shows.
  # ---------------------------------------------------------------------------
  h3-conformance:
    runs-on: macos-26
    env:
      HTTP_WARNINGS_AS_ERRORS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Toolchain
        run: swift --version
      - name: RFC 9114 / RFC 9204 conformance (release)
        run: |
          swift test -c release --scratch-path "$SCRATCH" \
            --filter 'HTTP3Tests' --filter 'QPACKTests'
      - name: HTTP/3 over real QUIC — loopback integration (release)
        run: |
          swift test -c release --scratch-path "$SCRATCH" \
            --filter 'HTTPServerHTTP3Tests' --filter 'HTTPServerWebSocketHTTP3Tests'

  # ---------------------------------------------------------------------------
  # External h3spec — EVIDENCE, not a gate, and dispatch-only so it never contributes a red X that
  # everyone learns to ignore. That is the failure mode this job was in: `continue-on-error: true`,
  # 48/49 red on every run, gating nothing and proving nothing.
  #
  # The two steps below encode the split the moment it becomes runnable. Step 1 is the subset that
  # would gate (`-m "HTTP/3 servers"`, RFC 9114 §4/§6.2/§7.2 + RFC 9204 §3.1/§4.1.3/§4.2/§4.4.3).
  # Step 2 is the excluded subset, run only to keep observing it. The excluded cases are listed BY
  # NAME with their expected error codes in the in-repo catalog — `H3Catalog+Transport.swift` (27
  # RFC 9000 rows) and the `quicTLS` block of `H3ConformanceCatalog.swift` (7 RFC 9001 rows) — each
  # `.platform`-stamped, i.e. enforced by Apple's QUIC/TLS stack rather than by any code here. That
  # file is the authoritative exclusion list; it is asserted complete by `H3SpecTests`.
  #
  # Promote step 1 to a required job when its cases stop failing on the handshake — the blocker is
  # the ephemeral QUIC listener port, not the h3 engine (see docs/standards/CONFORMANCE.md).
  # ---------------------------------------------------------------------------
  h3spec-observation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Download h3spec (pinned release, arm64 mac binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.13 -R kazu-yamamoto/h3spec -p "h3spec-mac-arm64" -O /tmp/h3spec --clobber
          chmod +x /tmp/h3spec
      - name: Build example server (release)
        run: swift build -c release --product httpd-example --scratch-path "$SCRATCH"
      - name: Start httpd-example (QUIC + self-signed TLS)
        run: |
          BIN="$(swift build -c release --product httpd-example --scratch-path "$SCRATCH" --show-bin-path)/httpd-example"
          "$BIN" 14433 networkFramework tls quiet >/tmp/httpd-h3.log 2>&1 &
          echo $! > /tmp/httpd-h3.pid
          # Wait for the TLS listener (the h1/h2 side of the same TCP port).
          for _ in $(seq 1 40); do
            curl -sk --max-time 1 -o /dev/null https://127.0.0.1:14433/ && break
            sleep 0.5
          done
          # Record which UDP port the QUIC listener actually bound — this is the discrepancy that
          # makes the run vacuous, so surface it rather than letting it hide in the failures.
          curl -skI --max-time 4 https://127.0.0.1:14433/ | grep -i alt-svc || true
      - name: h3spec — the RFC 9114/9204 subset (the gating candidate)
        run: |
          /tmp/h3spec 127.0.0.1 14433 -n -t 4000 -m "HTTP/3 servers" \
            2>&1 | tee /tmp/h3spec-http3.txt || true
      - name: h3spec — the QUIC transport/TLS subset (excluded; see the in-repo catalog)
        run: |
          /tmp/h3spec 127.0.0.1 14433 -n -t 4000 -m "QUIC servers" \
            2>&1 | tee /tmp/h3spec-quic.txt || true
      - name: Stop the server
        if: always()
        run: kill "$(cat /tmp/httpd-h3.pid)" 2>/dev/null || true
      - name: Upload h3spec reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3spec-reports
          path: |
            /tmp/h3spec-http3.txt
            /tmp/h3spec-quic.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # h3 load smoke (P10) — an h2load HTTP/3 leg against httpd-example's QUIC listener; non-gating
  # like the benchmark numbers (shared-runner load figures are noise — this leg guards "the h3
  # path serves a real load client end-to-end" and surfaces the numbers in the job summary).
  # Homebrew's nghttp2 h2load only speaks HTTP/3 when built against ngtcp2+nghttp3, so support is
  # detected at runtime: absent support logs an EXPLICIT skip (P10: no silent omission).
  # ---------------------------------------------------------------------------
  bench-h3load:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Install h2load (nghttp2)
        run: brew list nghttp2 >/dev/null 2>&1 || brew install nghttp2
      - name: Build example server (release)
        run: swift build -c release --product httpd-example --scratch-path "$SCRATCH"
      - name: h3 load smoke (h2load --alpn-list=h3)
        run: |
          if ! h2load --version | grep -qiE "nghttp3|ngtcp2"; then
            echo "::warning::brew h2load lacks HTTP/3 (built without ngtcp2/nghttp3) — h3 load leg SKIPPED explicitly (P10 no-silent-omission)"
            h2load --version || true
            exit 0
          fi
          BIN="$(swift build -c release --product httpd-example --scratch-path "$SCRATCH" --show-bin-path)/httpd-example"
          "$BIN" 14434 networkFramework tls quiet >/tmp/httpd-h3load.log 2>&1 &
          PID=$!
          for _ in $(seq 1 40); do
            curl -sk --max-time 1 -o /dev/null https://127.0.0.1:14434/ && break
            sleep 0.5
          done
          set +e
          h2load -n 2000 -c 20 --alpn-list=h3 https://127.0.0.1:14434/ | tee /tmp/h3load.txt
          rc=$?
          set -e
          kill "$PID" 2>/dev/null || true
          {
            echo "## h3load smoke (h2load --alpn-list=h3, 2000 req / 20 conns)"
            echo '```text'
            cat /tmp/h3load.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

# NOTE: jobs run on the `macos-26` image with the Swift 6.4 development toolchain. If a specific 6.4
# snapshot is needed beyond the image default, install it as the first step of each job with swiftly
# (`swiftly install 6.4-snapshot --use`). The seeded fuzz suites (.tags(.fuzz)) run inside build-test
# and under the ASan/TSan matrix above — no separate lane needed.
#
# Tracked follow-ups (each blocked on a specific item, see docs/standards/CONFORMANCE.md):
#   • The streams section (http2/5) is now gated — the 5.1.2 hang and the 5.1.12 closed-stream nuance
#     are fixed. Only generic/http2-3 stay out, for the invalid-preface GOAWAY (a benign ambiguity).
#   • Autobahn (WebSocket, RFC 6455) — PROMOTED to a required gate (P10, 2026-07-02) after
#     consecutive green runs; the fuzzingclient report gate blocks on any FAILED case.
#   • HTTP/3 (RFC 9114 / RFC 9204) — REQUIRED as `h3-conformance`, driven from the in-repo suites
#     that mirror h3spec's catalog row-for-row. The external tool moved to `h3spec-observation`
#     (dispatch-only, non-gating): a re-run showed its 48 failures are one QUIC handshake timeout
#     reported 48 times, not 48 findings, so it cannot tell a correct engine from a broken one. The
#     blocker to promoting it is that the QUIC listener binds an EPHEMERAL UDP port rather than the
#     one it was given, so h3spec dials a dead port. See docs/standards/CONFORMANCE.md.
#   • Benchmark baseline gate — harness health is REQUIRED now; the low-noise drift check
#     (malloc zero-delta + instructions ±5%) activates when a runner-class baseline is committed
#     under Benchmarking/Benchmarks/.benchmarkBaselines/ (capture via dispatch update_baseline).
#   • UBSan (-sanitize=undefined) — the UBSan runtime fails to link the test bundles on the current
#     6.4 toolchain; revisit when the toolchain ships a linkable UBSan runtime.
