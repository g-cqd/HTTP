name: Save the SwiftPM tree
description: "Saves what spm-restore keyed, from the default branch only and only when the exact key was a miss."
inputs:
  name:
    required: true
  hit:
    description: "The `hit` output of spm-restore."
    required: true
  swift-version:
    required: false
    default: "6.4.1"
  path:
    required: false
    default: /tmp/swiftpm-build/HTTP
runs:
  using: composite
  steps:
    - if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: spm-${{ runner.os }}-${{ inputs.name }}-${{ inputs.swift-version }}-${{ hashFiles('Package.swift') }}
